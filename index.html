<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Calendar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext x='0' y='13' font-size='14'%3E%F0%9F%93%B7%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#FBFAF7;
    --surface:#FFFFFF;
    --ink:#1A1A1A;
    --ink-soft:#6E6E6E;
    --ink-faint:#9C9C9C;
    --line:#E6E5E1;
    --line-strong:#D8D6D0;
    --slot-empty:#EFEDE7;
    --accent-plan:#868E96;
    --accent-plan-bg:#F1F1F0;
    --accent-ready:#1C7ED6;
    --accent-ready-bg:#E3F0FC;
    --accent-posted:#2F9E44;
    --accent-posted-bg:#E6F4E9;
    --danger:#E03131;
    --today-bg:#E7EFFE;
    --today-ink:#3B5BDB;
    --weekend:#E03131;
    --radius:5px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans KR','Apple Color Emoji','Segoe UI Emoji','Segoe UI Symbol','Noto Color Emoji',sans-serif;
    font-size:14px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:inherit;}
  button{
    font-family:'Noto Sans KR','Apple Color Emoji','Segoe UI Emoji','Segoe UI Symbol','Noto Color Emoji',sans-serif;
    cursor:pointer;
    border:none;
    background:none;
    color:inherit;
    font-size:13px;
  }
  input,select,textarea{
    font-family:'Noto Sans KR','Apple Color Emoji','Segoe UI Emoji','Segoe UI Symbol','Noto Color Emoji',sans-serif;
    font-size:13px;
    color:var(--ink);
    background:var(--surface);
    border:1px solid var(--line-strong);
    border-radius:var(--radius);
    padding:8px 10px;
    width:100%;
  }
  textarea{ resize:vertical; min-height:70px; }
  input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{
    outline:2px solid var(--accent-ready);
    outline-offset:1px;
  }
  .wrap{ max-width:1880px; margin:0 auto; padding:32px 40px 80px; }

  /* ---------- 사이트 이동 네비게이션 ---------- */
  .site-nav{
    display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    font-size:12.5px; color:var(--ink-faint); margin-bottom:14px;
  }
  .site-nav a{ color:var(--ink-soft); text-decoration:none; padding:2px 0; border-bottom:1px solid transparent; }
  .site-nav a:hover{ color:var(--ink); border-bottom-color:var(--ink-soft); }
  .site-nav a.current{ color:var(--ink); font-weight:700; border-bottom-color:var(--ink); }
  .site-nav .site-nav-sep{ color:var(--line-strong); }

  /* ---------- Header ---------- */
  .top{
    display:flex; justify-content:space-between; align-items:flex-end; gap:16px;
    border-bottom:1px solid var(--line-strong);
    padding-bottom:20px; margin-bottom:24px; flex-wrap:wrap;
  }
  .brand-title{ font-weight:700; font-size:30px; letter-spacing:-0.03em; }
  .top-actions{ display:flex; gap:10px; align-items:center; padding-bottom:4px; }
  .top-actions .link-btn{ color:var(--ink-soft); border-bottom:1px solid transparent; padding:2px 6px; }
  .top-actions .link-btn:hover{ color:var(--ink); border-bottom-color:var(--ink-soft); }

  .primary-btn{
    background:var(--ink); color:var(--bg); padding:8px 16px;
    border-radius:var(--radius); font-weight:600; white-space:nowrap;
  }
  .primary-btn:hover{ background:#3a3a3a; }
  .outline-btn{
    border:1px solid var(--line-strong); padding:7px 14px;
    border-radius:var(--radius); font-weight:600; white-space:nowrap; color:var(--ink);
  }
  .outline-btn:hover{ border-color:var(--ink); }

  .owner-only-hidden{ display:none !important; }

  /* ---------- Calendar controls ---------- */
  .cal-controls{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:12px; }
  .month-nav{ display:flex; align-items:center; gap:14px; }
  .month-nav button{ font-size:18px; color:var(--ink-soft); width:24px; height:24px; display:flex; align-items:center; justify-content:center; }
  .month-nav button:hover{ color:var(--ink); }
  .month-title{ font-size:19px; font-weight:700; min-width:110px; text-align:center; }
  .status-legend{ display:flex; gap:14px; font-size:12px; color:var(--ink-soft); flex-wrap:wrap; }
  .status-legend span{ display:flex; align-items:center; gap:5px; }
  .legend-dot{ width:8px; height:8px; border-radius:50%; display:inline-block; }
  .legend-bar{ width:14px; height:8px; border-radius:2px; display:inline-block; }

  /* ---------- Month grid ---------- */
  .weekday-row{ display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:6px; }
  .weekday-row span{ font-size:12px; font-weight:600; color:var(--ink-soft); text-align:left; padding-left:4px; }
  .weekday-row span.weekend{ color:var(--weekend); }
  .month-grid-wrap{ position:relative; }
  .month-grid{
    display:grid; grid-template-columns:repeat(7,1fr);
    border-top:1px solid var(--line); border-left:1px solid var(--line);
  }
  .month-bars-layer{ position:absolute; inset:0; pointer-events:none; }
  .event-bar{
    position:absolute; height:20px; border-radius:2px;
    font-size:12px; font-weight:600; display:flex; align-items:center;
    padding:0 7px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
    cursor:pointer; pointer-events:auto; box-sizing:border-box;
  }
  .day-cell{
    border-right:1px solid var(--line); border-bottom:1px solid var(--line);
    display:flex; flex-direction:column;
    background:var(--surface); position:relative; overflow:hidden;
  }
  .day-cell.muted{ background:var(--bg); }
  .day-cell.today{ background:var(--today-bg); }
  .event-spacer{ flex-shrink:0; }
  .day-head{ display:flex; justify-content:space-between; align-items:center; padding:5px 8px 3px; flex-shrink:0; }
  .day-num{ font-size:12.5px; font-weight:600; color:var(--ink-soft); }
  .day-num.weekend{ color:var(--weekend); }
  .day-cell.today .day-num{ color:var(--today-ink); font-weight:700; }
  .day-post-slot{
    position:relative; width:100%; aspect-ratio:4/5;
    background:var(--slot-empty); cursor:pointer; overflow:hidden;
  }
  .day-cell.muted .day-post-slot{ visibility:hidden; }
  .day-post-slot img{ width:100%; height:100%; object-fit:cover; display:block; }
  .day-post-slot .slot-status-dot{
    position:absolute; top:6px; left:6px; width:8px; height:8px; border-radius:50%;
    box-shadow:0 0 0 2px rgba(255,255,255,0.85);
  }
  .day-post-slot .slot-badge{
    position:absolute; bottom:5px; right:5px; background:rgba(0,0,0,0.65); color:#fff;
    font-size:10.5px; font-weight:600; padding:2px 6px; border-radius:9px;
  }
  .day-post-slot .slot-carousel-icon{
    position:absolute; top:6px; right:6px; width:15px; height:15px;
  }
  .day-post-slot .slot-cap{
    position:absolute; left:0; right:0; bottom:0; padding:16px 7px 5px;
    font-size:11px; color:#fff; background:linear-gradient(transparent, rgba(0,0,0,0.55));
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .status-dot.s-planned{ background:var(--accent-plan); }
  .status-dot.s-ready{ background:var(--accent-ready); }
  .status-dot.s-posted{ background:var(--accent-posted); }

  .status-badge{ font-size:11px; font-weight:600; padding:3px 9px; border-radius:12px; flex-shrink:0; }
  .status-badge.s-planned{ background:var(--accent-plan-bg); color:var(--accent-plan); }
  .status-badge.s-ready{ background:var(--accent-ready-bg); color:var(--accent-ready); }
  .status-badge.s-posted{ background:var(--accent-posted-bg); color:var(--accent-posted); }

  /* ---------- Modal ---------- */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(26,26,26,0.4);
    align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    background:var(--surface); border-radius:8px; padding:26px;
    width:100%; max-width:460px; max-height:90vh; overflow-y:auto;
  }
  .modal-box.wide{ max-width:560px; max-height:94vh; }
  .modal-box.wide #post-caption{ min-height:160px; }
  .modal-title{ font-size:17px; font-weight:700; margin-bottom:18px; }
  .field-row{ margin-bottom:14px; }
  .field-row.split{ display:flex; gap:10px; }
  .field-row.split > div{ flex:1; }
  .field-label{ font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; display:block; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
  .ghost-btn{ padding:8px 14px; color:var(--ink-soft); }
  .ghost-btn:hover{ color:var(--ink); }
  .danger-btn{ padding:8px 14px; color:var(--danger); margin-right:auto; }
  .danger-btn:hover{ text-decoration:underline; }

  .img-drop{
    border:1px dashed var(--line-strong); border-radius:var(--radius);
    padding:14px; text-align:center; cursor:pointer; position:relative;
    transition:border-color .15s, background .15s;
  }
  .img-drop:hover{ border-color:var(--ink-soft); }
  .img-drop.drag-over{ border-color:var(--accent-ready); background:var(--accent-ready-bg); }
  .img-drop-label{ font-size:12.5px; color:var(--ink-faint); }
  .img-drop-label b{ color:var(--ink); font-weight:600; }
  .img-drop input[type=file]{ display:none; }

  .img-chip-strip{
    display:flex; gap:8px; overflow-x:auto; padding:2px 2px 10px;
    margin-top:10px;
  }
  .img-chip{
    position:relative; flex-shrink:0; width:76px; aspect-ratio:4/5;
    border-radius:4px; overflow:hidden; background:var(--slot-empty);
    border:1px solid var(--line); cursor:grab;
  }
  .img-chip.dragging{ opacity:0.4; }
  .img-chip img{ width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
  .img-chip .chip-order{
    position:absolute; top:3px; left:3px; background:rgba(0,0,0,0.6); color:#fff;
    font-size:10px; font-weight:600; padding:1px 5px; border-radius:8px;
  }
  .img-chip .chip-remove{
    position:absolute; top:3px; right:3px; width:17px; height:17px; border-radius:50%;
    background:rgba(0,0,0,0.65); color:#fff; font-size:12px; line-height:17px;
    text-align:center; cursor:pointer;
  }
  .img-chip .chip-remove:hover{ background:rgba(224,49,49,0.9); }

  .status-select-row{ display:flex; gap:8px; }
  .status-opt{
    flex:1; text-align:center; padding:8px 0; border:1px solid var(--line-strong);
    border-radius:var(--radius); font-size:12.5px; color:var(--ink-soft); cursor:pointer;
  }
  .status-opt.sel{ border-color:var(--ink); color:var(--ink); font-weight:700; background:var(--bg); }

  .color-input-row{ display:flex; align-items:center; gap:10px; }
  .color-input-row input[type="color"]{ width:44px; height:36px; padding:2px; cursor:pointer; }
  .color-input-row input[type="text"]{ width:120px; text-transform:uppercase; }

  .category-chip-row{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .category-chip{
    display:flex; align-items:center; gap:6px; padding:6px 10px 6px 8px;
    border:1px solid var(--line-strong); border-radius:999px; cursor:pointer;
    font-size:12.5px; color:var(--ink-soft); background:var(--surface); user-select:none;
  }
  .category-chip .cat-dot{ width:12px; height:12px; border-radius:50%; flex-shrink:0; }
  .category-chip.sel{ border-color:var(--ink); color:var(--ink); font-weight:700; background:var(--bg); }
  .cat-edit-toggle{
    margin-left:auto; font-size:11.5px; color:var(--ink-soft); cursor:pointer; text-decoration:underline;
    background:none; border:none; padding:4px;
  }
  .cat-edit-toggle:hover{ color:var(--ink); }
  .cat-edit-panel{
    display:none; margin-top:10px; padding:12px; border:1px solid var(--line-strong);
    border-radius:var(--radius); background:var(--bg);
  }
  .cat-edit-panel.open{ display:block; }
  .cat-edit-row{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .cat-edit-row:last-child{ margin-bottom:0; }
  .cat-edit-row label{ flex:1; font-size:12.5px; color:var(--ink); }
  .cat-edit-row input[type="color"]{ width:40px; height:30px; padding:2px; cursor:pointer; }

  .login-error{ color:var(--danger); font-size:12.5px; margin-top:8px; display:none; }

  /* ---------- 뷰 탭 (피드/스토리) ---------- */
  .view-tabs{ display:flex; gap:28px; border-bottom:1px solid var(--line); margin-bottom:28px; }
  .view-tab-btn{
    font-size:17px; padding:0 0 12px; color:var(--ink-faint);
    border-bottom:2px solid transparent; margin-bottom:-1px; font-weight:600; background:none; border-radius:0;
  }
  .view-tab-btn.sel{ color:var(--ink); font-weight:700; border-bottom-color:var(--ink); }
  .view-hide{ display:none !important; }

  /* ---------- 페이지 레이아웃 (캘린더 + 우측 메모) ---------- */
  .page-layout{ display:grid; grid-template-columns:1fr 300px; gap:28px; align-items:start; }
  .page-main{ min-width:0; }
  .page-side{ position:sticky; top:24px; }

  /* ---------- 이번 주 업로드 요약 ---------- */
  .week-summary-box{
    border:1px solid var(--line-strong); border-radius:var(--radius);
    background:var(--surface); padding:14px 16px; margin-bottom:20px;
  }
  .week-summary-empty{ font-size:13px; color:var(--ink-faint); }
  .week-summary-title{ font-size:13px; font-weight:700; margin-bottom:10px; }
  .week-summary-list{ display:flex; flex-direction:column; gap:6px; }
  .week-summary-item{
    display:flex; align-items:center; gap:10px; padding:6px 8px;
    border-radius:var(--radius); text-align:left; width:100%; cursor:pointer;
  }
  .week-summary-item:hover{ background:var(--bg); }
  .week-summary-item-title{ flex:1; font-size:13px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .week-summary-item-due{ font-size:11px; color:var(--ink-faint); flex-shrink:0; }

  /* ---------- 메모 패널 ---------- */
  .memo-panel{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px;
  }
  .memo-panel-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .memo-panel-title{ font-size:14px; font-weight:700; }
  .memo-add-btn{ font-size:12px; color:var(--ink-soft); border-bottom:1px solid var(--line-strong); padding:2px 0; }
  .memo-add-btn:hover{ color:var(--ink); border-bottom-color:var(--ink); }
  .memo-sidebar-board{ display:flex; flex-direction:column; gap:14px; }
  .memo-sidebar-empty{ font-size:12.5px; color:var(--ink-faint); }
  .memo-sidebar-note{
    padding:10px 12px 20px; border-radius:var(--radius); position:relative; cursor:pointer;
    font-size:12.5px; line-height:1.6; color:var(--ink); white-space:pre-wrap; word-break:break-word;
    border:1px solid var(--line); background:var(--surface);
  }
  .memo-sidebar-note:hover{ border-color:var(--line-strong); background:#FAFAF8; }
  .memo-sidebar-date{ position:absolute; bottom:8px; right:12px; font-size:10px; color:var(--ink-faint); }

  @media (max-width:900px){
    .page-layout{ grid-template-columns:1fr; }
    .page-side{ position:static; }
  }

  /* ---------- 스토리 리스트 ---------- */
  .story-list{ display:flex; flex-direction:column; gap:22px; }
  .story-day-title{
    font-size:13px; font-weight:700; color:var(--ink); margin-bottom:8px;
    padding-bottom:6px; border-bottom:1px solid var(--line);
  }
  .story-day-title .story-day-weekday{ color:var(--ink-soft); font-weight:500; margin-left:4px; }
  .story-day-rows{ display:flex; flex-direction:column; gap:8px; }
  .story-row{
    display:flex; align-items:center; gap:12px; padding:10px 12px;
    border:1px solid var(--line); border-radius:var(--radius); cursor:pointer; background:var(--surface);
  }
  .story-row:hover{ border-color:var(--line-strong); }
  .story-time{ font-size:12.5px; font-weight:700; color:var(--ink); width:56px; flex-shrink:0; white-space:nowrap; }
  .story-part-badge{
    font-size:11px; font-weight:700; padding:3px 9px; border-radius:12px; flex-shrink:0; color:#fff; white-space:nowrap;
  }
  .story-main{ flex:1; min-width:0; }
  .story-title-text{
    font-size:13.5px; font-weight:600; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .story-campaign{
    font-size:12px; color:var(--ink-soft); margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .story-status-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .story-empty{ text-align:center; color:var(--ink-soft); font-size:13px; padding:40px 0; }
  .story-notes{
    font-size:11.5px; color:var(--ink-faint); margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .story-notes::before{ content:"비고 · "; }
  .story-extras-line{
    font-size:11.5px; color:var(--ink-faint); margin-top:2px;
    display:flex; gap:8px; flex-wrap:wrap;
  }
  .story-extras-line span{
    background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:1px 8px;
  }
  .story-extra-fields{ display:flex; flex-direction:column; gap:8px; margin-top:8px; }
  .story-extra-input{ width:100%; }

  /* ---------- IG-style post preview modal ---------- */
  .preview-box{ padding:0; max-width:1180px; overflow:hidden; border-radius:10px; }
  .preview-layout{ display:flex; height:min(840px, 90vh); }
  .preview-media{
    position:relative; height:100%; flex-shrink:0; aspect-ratio:4/5;
    background:#111; overflow:hidden;
  }
  .preview-media img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none;
  }
  .preview-media img.active{ display:block; }
  .preview-noimg{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#777; font-size:13px; background:#1c1c1c;
  }
  .preview-nav{
    position:absolute; top:50%; left:10px; transform:translateY(-50%);
    width:32px; height:32px; padding:0; margin:0; border:none; border-radius:50%;
    background:rgba(255,255,255,0.5); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 1px 4px rgba(0,0,0,0.25); cursor:pointer; line-height:0;
  }
  .preview-nav svg{ display:block; width:16px; height:16px; }
  .preview-nav:hover{ background:rgba(255,255,255,0.85); }
  .preview-nav.prev{ left:10px; }
  .preview-nav.next{ left:auto; right:10px; }
  .preview-dots{
    position:absolute; bottom:10px; left:0; right:0; display:flex; justify-content:center; gap:5px;
  }
  .preview-dot{ width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,0.55); }
  .preview-dot.active{ background:#fff; width:6px; height:6px; }
  .preview-side{
    flex:1; min-width:360px; display:flex; flex-direction:column;
    background:var(--surface); min-height:0;
  }
  .preview-header{ display:flex; align-items:center; gap:10px; padding:16px 18px; border-bottom:1px solid var(--line); }
  .preview-avatar{
    width:32px; height:32px; border-radius:50%; background:var(--ink); color:var(--bg);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0;
  }
  .preview-username{ font-size:13px; font-weight:700; }
  .preview-body{ padding:16px 18px; overflow-y:auto; flex:1; min-height:0; }
  .preview-caption{ font-size:13.5px; white-space:pre-wrap; word-break:break-word; margin-bottom:10px; }
  .preview-hashtags{ font-size:13px; color:var(--accent-ready); word-break:break-word; }
  .preview-meta{
    display:flex; align-items:center; gap:10px; padding:12px 18px; border-top:1px solid var(--line);
    font-size:12px; color:var(--ink-faint);
  }
  .preview-actions{
    display:flex; gap:10px; padding:14px 18px; border-top:1px solid var(--line);
  }
  .preview-actions .primary-btn, .preview-actions .ghost-btn{ flex:1; text-align:center; }
  .preview-close{
    position:absolute; top:10px; right:10px; width:28px; height:28px; border-radius:50%;
    background:rgba(0,0,0,0.5); color:#fff; font-size:16px; z-index:2; display:flex;
    align-items:center; justify-content:center;
  }
  .preview-close:hover{ background:rgba(0,0,0,0.7); }

  @media (max-width:640px){
    .preview-layout{ flex-direction:column; height:auto; max-height:90vh; overflow-y:auto; }

  const STATUS_LABEL = { planned:"기획", ready:"제작완료", posted:"업로드완료" };

  /* ---------- 일정 카테고리(컬러칩) ---------- */
  const CATEGORY_DEFS = [
    { key:"offline",   label:"오프라인", def:"#FF6B6B" },
    { key:"online",    label:"온라인",   def:"#4D96FF" },
    { key:"marketing", label:"마케팅",   def:"#FFB84D" },
    { key:"branding",  label:"브랜딩",   def:"#9B6BFF" }
  ];
  const CATEGORY_STORAGE_KEY = "cc_category_colors_v1";
  let categoryColors = {};
  (function loadCategoryColors(){
    let saved = {};
    try{ saved = JSON.parse(localStorage.getItem(CATEGORY_STORAGE_KEY) || "{}"); }catch(e){ saved = {}; }
    CATEGORY_DEFS.forEach(c=>{ categoryColors[c.key] = saved[c.key] || c.def; });
  })();
  function saveCategoryColors(){
    try{ localStorage.setItem(CATEGORY_STORAGE_KEY, JSON.stringify(categoryColors)); }catch(e){}
  }
  function eventColor(ev){
    if(ev && ev.category && categoryColors[ev.category]) return categoryColors[ev.category];
    return (ev && ev.color) || "#1A1A1A";
  }

  function pad(n){ return String(n).padStart(2,"0"); }
  function escapeHtml(str){
    return String(str||"").replace(/[&<>"']/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
  }
  function dstr(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
  function todayStr(){ return dstr(new Date()); }
  function uidP(){ return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function uidE(){ return "e" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function uidS(){ return "s" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function uidM(){ return "m" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function openModal(id){ document.getElementById(id).classList.add("open"); }
  function closeModal(id){ document.getElementById(id).classList.remove("open"); }

  function readableTextColor(hex){
    if(!hex) return "#fff";
    const c = hex.replace("#","");
    const r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
    const yiq = (r*299 + g*587 + b*114) / 1000;
    return yiq >= 150 ? "#1A1A1A" : "#FFFFFF";
  }

  function carouselIconHTML(){
    return `<svg class="slot-carousel-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="8" width="13" height="13" rx="2.5" fill="#fff"/>
      <rect x="8.5" y="2.5" width="13" height="13" rx="2.5" fill="none" stroke="#fff" stroke-width="2"/>
    </svg>`;
  }


  /* ================= CALENDAR ================= */
  document.getElementById("prev-month").addEventListener("click", ()=>{
    curMonth.setMonth(curMonth.getMonth()-1); renderCalendar();
  });
  document.getElementById("next-month").addEventListener("click", ()=>{
    curMonth.setMonth(curMonth.getMonth()+1); renderCalendar();
  });

  function renderWeekdayRow(){
    const row = document.getElementById("weekday-row");
    row.innerHTML = "";
    WEEKDAYS.forEach((w,i)=>{
      const span = document.createElement("span");
      span.textContent = w;
      if(i===0||i===6) span.classList.add("weekend");
      row.appendChild(span);
    });
  }

  function postsByDate(){
    const map = {};
    posts.forEach(p=>{ (map[p.scheduled_date] = map[p.scheduled_date] || []).push(p); });
    Object.values(map).forEach(arr=> arr.sort((a,b)=> (a.created_at||"").localeCompare(b.created_at||"")));
    return map;
  }

  function renderCalendar(){
    document.getElementById("month-title").textContent =
      `${curMonth.getFullYear()}.${pad(curMonth.getMonth()+1)}`;
    const grid = document.getElementById("month-grid");
    const barsLayer = document.getElementById("month-bars-layer");
    grid.innerHTML = "";
    barsLayer.innerHTML = "";

    const year = curMonth.getFullYear(), month = curMonth.getMonth();
    const firstDay = new Date(year, month, 1);
    const startOffset = firstDay.getDay();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
    const byDate = postsByDate();
    const today = todayStr();

    const cellByDate = {};
    const weekDates = [];

    for(let i=0;i<totalCells;i++){
      const dayNum = i - startOffset + 1;
      const cell = document.createElement("div");
      cell.className = "day-cell";
      const weekIdx = Math.floor(i/7);
      const inMonth = dayNum >= 1 && dayNum <= daysInMonth;
      let cellDateStr;

      if(inMonth){
        const d = new Date(year, month, dayNum);
        cellDateStr = dstr(d);
        if(cellDateStr === today) cell.classList.add("today");

        const spacer = document.createElement("div");
        spacer.className = "event-spacer";
        cell.appendChild(spacer);

        const weekday = d.getDay();
        const head = document.createElement("div");
        head.className = "day-head";
        const numEl = document.createElement("span");
        numEl.className = "day-num" + ((weekday===0||weekday===6) ? " weekend" : "");
        numEl.textContent = dayNum;
        head.appendChild(numEl);
        cell.appendChild(head);

        const dayPosts = byDate[cellDateStr] || [];
        const slot = document.createElement("div");
        slot.className = "day-post-slot";
        if(dayPosts[0]){
          const p0 = dayPosts[0];
          const imgs = p0.images || [];
          if(imgs[0]){
            const img = document.createElement("img");
            img.src = imgs[0];
            img.loading = "lazy";
            slot.appendChild(img);
          }
          const dot = document.createElement("span");
          dot.className = "slot-status-dot status-dot s-"+p0.status;
          slot.appendChild(dot);
          if(imgs.length > 1){
            slot.insertAdjacentHTML("beforeend", carouselIconHTML());
          }
          if(!imgs[0] && p0.caption){
            const cap = document.createElement("div");
            cap.className = "slot-cap";
            cap.textContent = p0.caption;
            slot.appendChild(cap);
          }
          if(dayPosts.length > 1){
            const badge = document.createElement("span");
            badge.className = "slot-badge";
            badge.textContent = "+"+(dayPosts.length-1);
            slot.appendChild(badge);
          }
          slot.addEventListener("click", e=>{ e.stopPropagation(); openPostPreview(p0); });
        } else {
          slot.style.cursor = "default";
        }
        cell.appendChild(slot);
        cell.addEventListener("dblclick", ()=> openPostModalForNew(cellDateStr));
      } else {
        cell.classList.add("muted");
        const head = document.createElement("div");
        head.className = "day-head";
        cell.appendChild(head);
        const slot = document.createElement("div");
        slot.className = "day-post-slot";
        cell.appendChild(slot);
      }

      if(!weekDates[weekIdx]) weekDates[weekIdx] = [];
      weekDates[weekIdx].push(cellDateStr || "");
      if(cellDateStr) cellByDate[cellDateStr] = cell;

      grid.appendChild(cell);
    }

    /* ---- 일정(행사/이슈) 막대: 주 단위로 겹치지 않게 레인 배정, 모든 일정을 막대로 표시 ---- */
    const wrapRect = document.getElementById("month-grid-wrap").getBoundingClientRect();
    const BAR_H = 20, BAR_GAP = 3;

    weekDates.forEach(week=>{
      const validWeek = week.filter(Boolean);
      if(validWeek.length===0) return;
      const weekStart = validWeek[0], weekEnd = validWeek[validWeek.length-1];
      const weekEvents = events.filter(ev=> ev.end_date >= weekStart && ev.start_date <= weekEnd);
      if(weekEvents.length===0) return;

      const segments = weekEvents.map(ev=>{
        const clipStart = ev.start_date < weekStart ? weekStart : ev.start_date;
        const clipEnd = ev.end_date > weekEnd ? weekEnd : ev.end_date;
        return { ev, startCol: week.indexOf(clipStart), endCol: week.indexOf(clipEnd) };
      }).filter(s=> s.startCol>-1 && s.endCol>-1)
        .sort((a,b)=> a.startCol-b.startCol || (b.endCol-b.startCol)-(a.endCol-a.startCol));

      const lanes = [];
      segments.forEach(seg=>{
        let laneIdx = lanes.findIndex(lastEnd=> lastEnd < seg.startCol);
        if(laneIdx===-1){ laneIdx = lanes.length; lanes.push(seg.endCol); }
        else{ lanes[laneIdx] = seg.endCol; }
        seg.lane = laneIdx;
      });

      const refCell = cellByDate[week[0]];
      const refHead = refCell ? refCell.querySelector(".day-head") : null;
      const baseTop = refHead ? (refHead.getBoundingClientRect().top - wrapRect.top) : 0;

      // 막대가 몇 줄(레인)을 쓰든 같은 주의 모든 칸은 같은 높이만큼 날짜 숫자를 아래로 밀어서
      // 요일 숫자가 가로로 한 줄에 가지런히 맞춰지도록 함 (막대가 걸리지 않은 날짜도 동일)
      const maxLanes = segments.reduce((m,seg)=> Math.max(m, seg.lane+1), 0);
      week.forEach(dateStr=>{
        const cell = cellByDate[dateStr];
        if(cell){
          const spacer = cell.querySelector(".event-spacer");
          if(spacer) spacer.style.height = (maxLanes*(BAR_H+BAR_GAP))+"px";
        }
      });

      segments.forEach(seg=>{
        const startCell = cellByDate[week[seg.startCol]];
        const endCell = cellByDate[week[seg.endCol]];
        if(!startCell || !endCell) return;
        const startRect = startCell.getBoundingClientRect();
        const endRect = endCell.getBoundingClientRect();
        const bar = document.createElement("div");
        bar.className = "event-bar";
        bar.style.left = (startRect.left - wrapRect.left + 4) + "px";
        bar.style.width = (endRect.right - startRect.left - 8) + "px";
        bar.style.top = (baseTop + seg.lane*(BAR_H+BAR_GAP)) + "px";
        bar.style.background = eventColor(seg.ev);
        bar.style.color = readableTextColor(eventColor(seg.ev));
        bar.textContent = seg.ev.title;
        bar.addEventListener("click", e=>{ e.stopPropagation(); openEventModalForEdit(seg.ev); });
        barsLayer.appendChild(bar);
      });
    });
  }

  function renderImageChips(){
    const strip = document.getElementById("img-chip-strip");
    strip.innerHTML = "";
    imageItems.forEach((item, idx)=>{
      const chip = document.createElement("div");
      chip.className = "img-chip";
      chip.draggable = true;
      chip.dataset.idx = idx;
      const img = document.createElement("img");
      img.src = item.kind === "existing" ? item.url : item.previewUrl;
      chip.appendChild(img);
      const order = document.createElement("span");
      order.className = "chip-order";
      order.textContent = idx+1;
      chip.appendChild(order);
      const remove = document.createElement("span");
      remove.className = "chip-remove";
      remove.textContent = "×";
      remove.addEventListener("click", ev=>{
        ev.stopPropagation();
        if(item.previewUrl) URL.revokeObjectURL(item.previewUrl);
        imageItems.splice(idx,1);
        renderImageChips();
      });
      chip.appendChild(remove);

      chip.addEventListener("dragstart", ev=>{
        chip.classList.add("dragging");
        ev.dataTransfer.setData("text/plain", String(idx));
      });
      chip.addEventListener("dragend", ()=> chip.classList.remove("dragging"));
      chip.addEventListener("dragover", ev=> ev.preventDefault());
      chip.addEventListener("drop", ev=>{
        ev.preventDefault();
        ev.stopPropagation();
        const fromIdx = Number(ev.dataTransfer.getData("text/plain"));
        if(Number.isNaN(fromIdx) || fromIdx===idx) return;
        const [moved] = imageItems.splice(fromIdx,1);
        imageItems.splice(idx,0,moved);
        renderImageChips();
      });

      strip.appendChild(chip);
    });
    document.getElementById("img-drop-label").innerHTML = imageItems.length
      ? `<b>+ 이미지 추가</b> (클릭 또는 드래그, 현재 ${imageItems.length}장 · 순서는 끌어서 변경)`

  }

        slidesEl.appendChild(img);
      });
    }
    document.getElementById("preview-prev").style.display = imgs.length > 1 ? "" : "none";
    document.getElementById("preview-next").style.display = imgs.length > 1 ? "" : "none";

    const dotsEl = document.getElementById("preview-dots");

  async function resolveImageUrls(){
    const urls = [];
    for(const item of imageItems){
      if(item.kind === "existing"){ urls.push(item.url); continue; }
      const ext = (item.file.name.split(".").pop() || "jpg").toLowerCase();
      const path = `${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
      const { error } = await sb.storage.from("post-images").upload(path, item.file, { upsert:false });
      if(error){ alert("이미지 업로드 실패: "+error.message); throw error; }
      const { data } = sb.storage.from("post-images").getPublicUrl(path);
      urls.push(data.publicUrl);
    }
    return urls;
  }

  function storiesByDateInMonth(){
    const year = curMonth.getFullYear(), month = curMonth.getMonth();
    const map = {};
    stories.forEach(s=>{
      const d = new Date(s.scheduled_date + "T00:00:00");
      if(d.getFullYear()===year && d.getMonth()===month){
        (map[s.scheduled_date] = map[s.scheduled_date] || []).push(s);
      }
    });
    Object.values(map).forEach(arr=> arr.sort((a,b)=> (a.scheduled_time||"99:99").localeCompare(b.scheduled_time||"99:99")));
    return map;
  }

      wrap.innerHTML = `<div class="story-empty">이번 달 등록된 스토리가 없어요.</div>`;

      const rows = document.createElement("div");
      rows.className = "story-day-rows";
      byDate[dateStr].forEach(s=>{
        const row = document.createElement("div");
        row.className = "story-row";
        const partColor = categoryColors[s.part] || "#999999";

        if(s.extra_link !== null && s.extra_link !== undefined) extraBadges.push(`<span>🔗 링크${s.extra_link ? ": "+escapeHtml(s.extra_link) : ""}</span>`);
        if(s.extra_regram !== null && s.extra_regram !== undefined) extraBadges.push(`<span>🔁 리그램${s.extra_regram ? " "+escapeHtml(s.extra_regram) : ""}</span>`);
        if(s.extra_countdown !== null && s.extra_countdown !== undefined) extraBadges.push(`<span>⏱ 카운트다운${s.extra_countdown ? " "+escapeHtml(s.extra_countdown) : ""}</span>`);
        row.innerHTML = `
          <div class="story-time">${(s.scheduled_time||"").slice(0,5)}</div>
          <span class="story-part-badge" style="background:${partColor};">${escapeHtml(partLabel(s.part))}</span>

            <div class="story-title-text">${escapeHtml(s.title||"")}</div>
            ${s.campaign ? `<div class="story-campaign">${escapeHtml(s.campaign)}</div>` : ""}
            ${extraBadges.length ? `<div class="story-extras-line">${extraBadges.join("")}</div>` : ""}
            ${s.notes ? `<div class="story-notes">${escapeHtml(s.notes)}</div>` : ""}
          </div>
          <span class="story-status-dot" style="background:${s.status==='posted' ? 'var(--accent-posted)' : 'var(--accent-plan)'};" title="${STORY_STATUS_LABEL[s.status]||""}"></span>
        `;
        if(s.notes) row.title = "비고: " + s.notes;
        row.addEventListener("click", ()=> openStoryModalForEdit(s));
        rows.appendChild(row);
      });
      group.appendChild(rows);
      wrap.appendChild(group);
    });
  }

  /* ================= 스토리 모달 ================= */
  function selectStoryPart(key){
    selectedStoryPart = key;
    renderStoryPartChips();
  }

  function renderStoryPartChips(){
    const row = document.getElementById("story-part-row");
    row.innerHTML = "";
    ["branding","marketing"].forEach(key=>{
      const def = CATEGORY_DEFS.find(c=>c.key===key);
      const chip = document.createElement("div");
      chip.className = "category-chip" + (selectedStoryPart===key ? " sel" : "");
      chip.innerHTML = `<span class="cat-dot" style="background:${categoryColors[key]};"></span>${def.label}`;
      chip.addEventListener("click", ()=> selectStoryPart(key));
      row.appendChild(chip);
    });
  }

  const STORY_EXTRA_DEFS = [
    { key:"link", label:"링크 삽입", inputId:"story-extra-link" },
    { key:"regram", label:"리그램 계정", inputId:"story-extra-regram" },
    { key:"countdown", label:"카운트다운", inputId:"story-extra-countdown" }
  ];

  function toggleStoryExtra(key){
    selectedStoryExtras[key] = !selectedStoryExtras[key];
    if(!selectedStoryExtras[key]){
      const def = STORY_EXTRA_DEFS.find(d=>d.key===key);
      document.getElementById(def.inputId).value = "";
    }
    renderStoryExtraChips();
  }

  function renderStoryExtraChips(){
    const row = document.getElementById("story-extra-row");
    row.innerHTML = "";
    STORY_EXTRA_DEFS.forEach(def=>{
      const chip = document.createElement("div");
      chip.className = "category-chip" + (selectedStoryExtras[def.key] ? " sel" : "");
      chip.textContent = def.label;
      chip.addEventListener("click", ()=> toggleStoryExtra(def.key));
      row.appendChild(chip);
      document.getElementById(def.inputId).style.display = selectedStoryExtras[def.key] ? "" : "none";
    });
  }

  function setStoryFormEnabled(enabled){
    document.querySelectorAll("#story-form input, #story-form textarea").forEach(el=>{
      if(enabled){ el.removeAttribute("disabled"); } else { el.setAttribute("disabled","disabled"); }
    });
    document.querySelector("#story-form button[type=submit]").style.display = enabled ? "" : "none";
    document.getElementById("story-part-row").style.pointerEvents = enabled ? "" : "none";
    document.getElementById("story-part-row").style.opacity = enabled ? "" : "0.6";
    document.getElementById("story-status-row").style.pointerEvents = enabled ? "" : "none";
    document.getElementById("story-status-row").style.opacity = enabled ? "" : "0.6";
    document.getElementById("story-extra-row").style.pointerEvents = enabled ? "" : "none";
    document.getElementById("story-extra-row").style.opacity = enabled ? "" : "0.6";
  }

  function setStoryStatusSelect(status){
    document.querySelectorAll("#story-status-row .status-opt").forEach(el=>{
      el.classList.toggle("sel", el.dataset.status === status);
    });
  }
  document.querySelectorAll("#story-status-row .status-opt").forEach(el=>{
    el.addEventListener("click", ()=> setStoryStatusSelect(el.dataset.status));
  });

  function openStoryModalForNew(dateStr){
    if(!isOwner){ openModal("login-modal"); return; }
    editingStoryId = null;
    document.getElementById("story-modal-title").textContent = "새 스토리";
    document.getElementById("story-date").value = dateStr || todayStr();
    document.getElementById("story-time").value = "";
    document.getElementById("story-title").value = "";
    document.getElementById("story-campaign").value = "";
    document.getElementById("story-notes").value = "";
    selectedStoryPart = null;
    renderStoryPartChips();
    selectedStoryExtras = { link:false, regram:false, countdown:false };
    document.getElementById("story-extra-link").value = "";
    document.getElementById("story-extra-regram").value = "";
    document.getElementById("story-extra-countdown").value = "";
    renderStoryExtraChips();
    setStoryStatusSelect("planned");
    document.getElementById("story-delete-btn").style.display = "none";
    setStoryFormEnabled(true);
    openModal("story-modal");
  }

  function openStoryModalForEdit(s){
    editingStoryId = s.id;
    document.getElementById("story-modal-title").textContent = isOwner ? "스토리 수정" : "스토리 내용";
    document.getElementById("story-date").value = s.scheduled_date;
    document.getElementById("story-time").value = (s.scheduled_time||"").slice(0,5);
    document.getElementById("story-title").value = s.title || "";
    document.getElementById("story-campaign").value = s.campaign || "";
    document.getElementById("story-notes").value = s.notes || "";
    selectedStoryPart = s.part || null;
    renderStoryPartChips();
    selectedStoryExtras = {
      link: s.extra_link !== null && s.extra_link !== undefined,
      regram: s.extra_regram !== null && s.extra_regram !== undefined,
      countdown: s.extra_countdown !== null && s.extra_countdown !== undefined
    };
    document.getElementById("story-extra-link").value = s.extra_link || "";
    document.getElementById("story-extra-regram").value = s.extra_regram || "";
    document.getElementById("story-extra-countdown").value = s.extra_countdown || "";
    renderStoryExtraChips();
    setStoryStatusSelect(s.status || "planned");
    document.getElementById("story-delete-btn").style.display = isOwner ? "" : "none";
    setStoryFormEnabled(isOwner);
    openModal("story-modal");
  }

  document.getElementById("add-story-btn").addEventListener("click", ()=> openStoryModalForNew());
  document.getElementById("story-cancel-btn").addEventListener("click", ()=> closeModal("story-modal"));

  document.getElementById("story-form").addEventListener("submit", async e=>{
    e.preventDefault();
    if(!isOwner) return;
    if(!selectedStoryPart){ alert("담당 파트(브랜딩/마케팅)를 선택해주세요."); return; }
    const date = document.getElementById("story-date").value;
    const time = document.getElementById("story-time").value;
    const title = document.getElementById("story-title").value.trim();
    const campaign = document.getElementById("story-campaign").value.trim();
    const notes = document.getElementById("story-notes").value.trim();
    const part = selectedStoryPart;
    const status = document.querySelector("#story-status-row .status-opt.sel")?.dataset.status || "planned";
    const extra_link = selectedStoryExtras.link ? document.getElementById("story-extra-link").value.trim() : null;
    const extra_regram = selectedStoryExtras.regram ? document.getElementById("story-extra-regram").value.trim() : null;
    const extra_countdown = selectedStoryExtras.countdown ? document.getElementById("story-extra-countdown").value.trim() : null;

    if(editingStoryId){
      const row = { id: editingStoryId, scheduled_date:date, scheduled_time:time, title, campaign, notes, extra_link, extra_regram, extra_countdown, part, status };
      const { error } = await sb.from("stories").update({
        scheduled_date:date, scheduled_time:time, title, campaign, notes, extra_link, extra_regram, extra_countdown, part, status
      }).eq("id", editingStoryId);
      if(error){ alert("수정 실패: "+error.message); return; }
      upsertLocal(stories, row);
    } else {
      const row = { id: uidS(), scheduled_date:date, scheduled_time:time, title, campaign, notes, extra_link, extra_regram, extra_countdown, part, status };
      const { error } = await sb.from("stories").insert(row);
      if(error){ alert("저장 실패: "+error.message); return; }
      upsertLocal(stories, row);
    }
    render();
    closeModal("story-modal");
  });

  document.getElementById("story-delete-btn").addEventListener("click", async ()=>{
    if(!editingStoryId) return;
    if(!confirm("삭제할까요? 삭제 후에는 복구할 수 없습니다.")) return;
    const { error } = await sb.from("stories").delete().eq("id", editingStoryId);
    if(error){ alert("삭제 실패: "+error.message); return; }
    removeLocal(stories, editingStoryId);
    render();
    closeModal("story-modal");
  });

  /* ================= 이번 주 업로드 요약 ================= */
  function weekRangeStr(){
    const now = new Date(); now.setHours(0,0,0,0);
    const weekStart = new Date(now); weekStart.setDate(now.getDate() - now.getDay());
    const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate()+6);
    return { start: dstr(weekStart), end: dstr(weekEnd) };
  }

  function renderWeekSummary(){
    const box = document.getElementById("week-summary-box");
    if(!box) return;
    const { start, end } = weekRangeStr();

    if(currentView === "feed"){
      const dueThisWeek = posts
        .filter(p=> p.scheduled_date >= start && p.scheduled_date <= end)
        .sort((a,b)=> (a.scheduled_date+(a.scheduled_time||"")).localeCompare(b.scheduled_date+(b.scheduled_time||"")));
      if(dueThisWeek.length === 0){
        box.innerHTML = `<div class="week-summary-empty">이번 주 업로드 예정인 포스트가 없어요.</div>`;
        return;
      }
      box.innerHTML = `<div class="week-summary-title">이번 주 업로드 ${dueThisWeek.length}건</div><div class="week-summary-list">` +
        dueThisWeek.map(p=>{
          const timeLabel = p.scheduled_time ? ` ${p.scheduled_time.slice(0,5)}` : "";
          return `<button type="button" class="week-summary-item" data-id="${p.id}">
            <span class="status-badge s-${p.status||"planned"}">${STATUS_LABEL[p.status]||""}</span>
            <span class="week-summary-item-title">${escapeHtml(p.caption||"(캡션 없음)")}</span>
            <span class="week-summary-item-due">${p.scheduled_date.slice(5)}${timeLabel}</span>
          </button>`;
        }).join("") + `</div>`;
      box.querySelectorAll(".week-summary-item").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const p = posts.find(x=>x.id===btn.dataset.id);
          if(p) openPostPreview(p);
        });
      });
    } else {
      const dueThisWeek = stories
        .filter(s=> s.scheduled_date >= start && s.scheduled_date <= end)
        .sort((a,b)=> (a.scheduled_date+(a.scheduled_time||"")).localeCompare(b.scheduled_date+(b.scheduled_time||"")));
      if(dueThisWeek.length === 0){
        box.innerHTML = `<div class="week-summary-empty">이번 주 업로드 예정인 스토리가 없어요.</div>`;
        return;
      }
      box.innerHTML = `<div class="week-summary-title">이번 주 업로드 ${dueThisWeek.length}건</div><div class="week-summary-list">` +
        dueThisWeek.map(s=>{
          const partColor = categoryColors[s.part] || "#999999";
          return `<button type="button" class="week-summary-item" data-id="${s.id}">
            <span class="story-part-badge" style="background:${partColor};">${escapeHtml(partLabel(s.part))}</span>
            <span class="week-summary-item-title">${escapeHtml(s.title||"")}</span>
            <span class="week-summary-item-due">${s.scheduled_date.slice(5)} ${(s.scheduled_time||"").slice(0,5)}</span>
          </button>`;
        }).join("") + `</div>`;
      box.querySelectorAll(".week-summary-item").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const s = stories.find(x=>x.id===btn.dataset.id);
          if(s) openStoryModalForEdit(s);
        });
      });
    }
  }

  /* ================= 메모 패널 ================= */
  function fmtMemoDate(ts){
    const d = new Date(ts);
    return `${d.getMonth()+1}.${pad(d.getDate())}`;
  }

  function openMemoModalForNew(){
    editingMemoId = null;
    document.getElementById("memo-modal-title").textContent = "메모 추가";
    document.getElementById("memo-content").value = "";
    document.getElementById("memo-delete-btn").style.display = "none";
    openModal("memo-modal");
  }

  function openMemoModalForEdit(m){
    editingMemoId = m.id;
    document.getElementById("memo-modal-title").textContent = "메모 수정";
    document.getElementById("memo-content").value = m.content || "";
    document.getElementById("memo-delete-btn").style.display = "";
    openModal("memo-modal");
  }

  document.getElementById("open-memo-modal-btn").addEventListener("click", openMemoModalForNew);
  document.getElementById("memo-cancel-btn").addEventListener("click", ()=> closeModal("memo-modal"));

  document.getElementById("memo-form").addEventListener("submit", async e=>{
    e.preventDefault();
    const content = document.getElementById("memo-content").value.trim();
    if(!content) return;
    if(editingMemoId){
      const row = { id: editingMemoId, content };
      const { error } = await sb.from("cc_memos").update({ content }).eq("id", editingMemoId);
      if(error){ alert("수정 실패: "+error.message); return; }
      upsertLocal(memos, Object.assign({}, memos.find(m=>m.id===editingMemoId), row));
    } else {
      const row = { id: uidM(), content };
      const { error } = await sb.from("cc_memos").insert(row);
      if(error){ alert("저장 실패: "+error.message); return; }
      upsertLocal(memos, row);
    }
    render();
    closeModal("memo-modal");
  });

  document.getElementById("memo-delete-btn").addEventListener("click", async ()=>{
    if(!editingMemoId) return;
    if(!confirm("메모를 삭제할까요?")) return;
    const { error } = await sb.from("cc_memos").delete().eq("id", editingMemoId);
    if(error){ alert("삭제 실패: "+error.message); return; }
    removeLocal(memos, editingMemoId);
    render();
    closeModal("memo-modal");
  });

  function renderMemoBoard(){
    const board = document.getElementById("memo-board");
    if(!board) return;
    board.innerHTML = "";
    if(memos.length === 0){
      board.innerHTML = `<div class="memo-sidebar-empty">아직 메모가 없어요. "+ 메모"로 남겨보세요.</div>`;
      return;
    }
    memos
      .slice()
      .sort((a,b)=> (b.created_at||"").localeCompare(a.created_at||""))
      .forEach(m=>{
        const note = document.createElement("div");
        note.className = "memo-sidebar-note";
        note.textContent = m.content || "";
        const date = document.createElement("div");
        date.className = "memo-sidebar-date";
        date.textContent = m.created_at ? fmtMemoDate(m.created_at) : "";
        note.appendChild(date);
        note.addEventListener("click", ()=> openMemoModalForEdit(m));
        board.appendChild(note);
      });
  }

  /* ================= 권한 =================
     누구나 로그인 없이 바로 작성/수정/삭제할 수 있는 공용 캘린더입니다. */
  function applyOwnerUI(){
    render();
  }

  /* ================= 데이터 불러오기 + 실시간 동기화 ================= */
  async function initialLoad(){
    const [postsRes, eventsRes, storiesRes, memosRes] = await Promise.all([
      sb.from("posts").select("*"),
      sb.from("events").select("*"),
      sb.from("stories").select("*"),
      sb.from("cc_memos").select("*")
    ]);
    if(postsRes.error || eventsRes.error || storiesRes.error || memosRes.error){
      console.error(postsRes.error || eventsRes.error || storiesRes.error || memosRes.error);
      alert("데이터를 불러오지 못했어요. 잠시 후 새로고침해주세요.");
      return;
    }
    posts = postsRes.data || [];
    events = eventsRes.data || [];
    stories = storiesRes.data || [];
    memos = memosRes.data || [];
    render();
  }

  function upsertLocal(arr, row){
    const idx = arr.findIndex(x=>x.id===row.id);
    if(idx>-1) arr[idx] = row; else arr.push(row);
  }
  function removeLocal(arr, id){
    const idx = arr.findIndex(x=>x.id===id);
    if(idx>-1) arr.splice(idx,1);
  }

  function applyRealtimeChange(arr, payload){
    if(payload.eventType === "INSERT"){
      upsertLocal(arr, payload.new);
    } else if(payload.eventType === "UPDATE"){
      upsertLocal(arr, payload.new);
    } else if(payload.eventType === "DELETE"){
      removeLocal(arr, payload.old.id);
    }
  }

  sb.channel("posts-changes")
    .on("postgres_changes", { event:"*", schema:"public", table:"posts" }, payload=>{
      applyRealtimeChange(posts, payload);
      render();
    }).subscribe();
  sb.channel("events-changes")
    .on("postgres_changes", { event:"*", schema:"public", table:"events" }, payload=>{
      applyRealtimeChange(events, payload);
      render();
    }).subscribe();
  sb.channel("stories-changes")
    .on("postgres_changes", { event:"*", schema:"public", table:"stories" }, payload=>{
      applyRealtimeChange(stories, payload);
      render();
    }).subscribe();
  sb.channel("cc-memos-changes")
    .on("postgres_changes", { event:"*", schema:"public", table:"cc_memos" }, payload=>{
      applyRealtimeChange(memos, payload);
      render();
    }).subscribe();

  /* ================= INIT ================= */
  switchView("feed");
  initialLoad();

  let resizeTimer = null;
  window.addEventListener("resize", ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(renderCalendar, 200);
  });
})();
</script>
